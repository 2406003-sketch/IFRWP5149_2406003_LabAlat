
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Portfolio Tracker</title>
    <link rel="stylesheet" href="style.css">

    <script src="dasar_logika.js" defer></script>
    <script src="olah_data.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <main class="container">
        <header class="page-header">
            <h1>Portofolio Proyek</h1>
            <p>Modul 4: Pengolahan Logika Data &amp; Interaktivitas DOM</p>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <h3>Total Proyek</h3>
                <p id="stat-total-projects">0</p>
            </div>

            <div class="stat-card">
                <h3>Total Anggaran</h3>
                <p id="stat-total-budget">Rp0</p>
            </div>

            <div class="stat-card">
                <h3>Selesai Dikerjakan</h3>
                <p id="stat-completed-projects">0</p>
            </div>
        </section>

        <section class="panel">
            <h2>Tambah Proyek Baru</h2>

            <form id="project-form">
                <label for="project-title">Judul Proyek</label>
                <input
                    type="text"
                    id="project-title"
                    placeholder="Masukkan judul proyek"
                    required
                >

                <label for="project-category">Kategori Proyek</label>
                <select id="project-category" required>
                    <option value="Web App">Web App</option>
                    <option value="Mobile App">Mobile App</option>
                    <option value="Desktop App">Desktop App</option>
                    <option value="UI/UX Design">UI/UX Design</option>
                </select>

                <label for="project-budget">Estimasi Anggaran (Rp)</label>
                <input
                    type="number"
                    id="project-budget"
                    placeholder="Contoh: 2500000"
                    min="1"
                    step="1"
                    required
                >

                <label class="checkbox-label" for="project-completed">
                    <input type="checkbox" id="project-completed">
                    Sudah Selesai
                </label>

                <button type="submit" class="btn btn-primary">
                    Tambah Proyek
                </button>

                <p id="form-message" aria-live="polite"></p>
            </form>
        </section>

        <section class="panel">
            <h2>Daftar Proyek</h2>

            <label for="search-project">Pencarian Proyek</label>
            <input
                type="text"
                id="search-project"
                placeholder="Cari berdasarkan nama proyek..."
            >

            <div class="filter-group">
                <button type="button" class="btn-filter active"
                    data-category="Semua">Semua Proyek</button>

                <button type="button" class="btn-filter"
                    data-category="Web App">Web App</button>

                <button type="button" class="btn-filter"
                    data-category="Desktop App">Desktop App</button>

                <button type="button" class="btn-filter"
                    data-category="Mobile App">Mobile App</button>

                <button type="button" class="btn-filter"
                    data-category="UI/UX Design">UI/UX Design</button>
            </div>

            <div id="project-list"></div>
        </section>
    </main>

    <footer>
        Interactive Portfolio Tracker &copy; 2026
    </footer>
</body>
</html>
